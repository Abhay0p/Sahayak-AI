version: '3.8'

services:
  backend-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://sahayak:sahayakpass@postgres:5432/sahayak
      - REDIS_URL=redis://redis:6379
      - IS_MONOLITH=true
      # Add other API keys here (e.g. GEMINI_API_KEY) in production or via a .env file
    depends_on:
      - redis
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sahayak
      - POSTGRES_PASSWORD=sahayakpass
      - POSTGRES_DB=sahayak
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
